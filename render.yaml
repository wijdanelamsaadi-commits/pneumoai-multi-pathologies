services:
  - type: web
    name: pneumoai-api
    runtime: python
    plan: free
    buildCommand: pip install -r backend-api/requirements.txt
    startCommand: uvicorn main:app --app-dir backend-api --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: FRONTEND_ORIGINS
        value: https://pneumoai-pneumonia-detection.vercel.app
